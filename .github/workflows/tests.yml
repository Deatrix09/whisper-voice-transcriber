name: tests

on:
  push:
    branches: [Production]
  pull_request:
    branches: [Production]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (uv.lock versions, CPU-only torch)
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra test -o requirements-lock.txt
          # CUDA torch stack from the lock is replaced by the CPU build of the same version.
          grep -vE '^(torch==|torchaudio==|triton==|nvidia-)' requirements-lock.txt > requirements-ci.txt
          # torch/torchaudio verze z locku (bez +cu126 suffixu) -> CPU kola stejné verze
          TORCH=$(grep -m1 -oE '^torch==[0-9.]+' requirements-lock.txt)
          TORCHAUDIO=$(grep -m1 -oE '^torchaudio==[0-9.]+' requirements-lock.txt)
          echo "Installing $TORCH $TORCHAUDIO (CPU)"
          uv pip install --system "$TORCH" "$TORCHAUDIO" --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements-ci.txt

      - name: Compile check
        run: python -m compileall -q src algorithm main.py app.py

      - name: Run tests
        run: python -m pytest tests/ -q
