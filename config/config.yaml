# Model settings

model:

  name: "large-v2"  # Choose between "tiny", "base", "small", "medium", "large-v2", "large-v3", "turbo"

  language: "en"  # Set to "cs" for Czech, or leave empty for automatic detection



# Whisper AI Configuration

whisper:

  sample_rate: 16000  # Audio sample rate



# Audio processing

audio:

  chunk_size: 360  # Size in seconds (6 minutes) for chunking large files
  chunk_threshold_mb: 15  # Files larger than this size (in MB) will be chunked
  chunk_overlap_sec: 5  # Overlap between chunks in seconds



# Performance settings

performance:

  device: "cuda"  # Use "cuda" for GPU or "cpu" for CPU

  num_workers: 4  # Number of worker threads for parallel processing



# Transcription settings

transcription:

  task: "transcribe"

  temperature: 0

  compression_ratio_threshold: 2.4

  logprob_threshold: -1.0

  no_speech_threshold: 0.6

  fp16: true  # Will be overridden based on CUDA availability

  verbose: false

  multi_language: false



# Diarization settings

diarization:

  enabled: true

  model: "pyannote/speaker-diarization-3.1"

  auth_token: "***REMOVED***"

  min_duration_off: 0.5

  min_cluster_size: 5

  method: "average"

  num_speakers: null  # Optional: Set number of speakers (e.g., 2). Leave as null for automatic detection



# Output settings

output:

  format: "txt"  # Default output format (txt, subtitle, or json)

  style: "timestamped"



# Logging

logging:

  level: "INFO"

  file: "whisper_transcription"  # Base filename, timestamp will be added automatically

  console_level: "INFO"

  file_level: "DEBUG"

  retention_days: 1  # Keep logs for 7 days 
