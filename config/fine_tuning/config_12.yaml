# Model settings
model:
  name: "large-v2"
  language: ""

# Whisper AI Configuration
whisper:
  sample_rate: 16000

# Audio processing
audio:
  chunk_size: 360
  chunk_threshold_mb: 20
  chunk_overlap_sec: 0

# Performance settings
performance:
  device: "cuda"
  num_workers: 4

# Transcription settings
transcription:
  task: "transcribe"
  temperature: 0.6
  compression_ratio_threshold: 3.5
  logprob_threshold: -2.5
  no_speech_threshold: 0.9
  fp16: true
  verbose: false
  multi_language: false

# Diarization settings
diarization:
  enabled: true
  module: "nemo"
  num_speakers: 3

  pyannote:
    enabled: false
    model: "pyannote/speaker-diarization-3.1"
    auth_token: "${HF_TOKEN}"
    min_duration_off: 0.9
    min_cluster_size: 3
    method: "complete"

  nemo:
    enabled: true
    vad_model: "vad_multilingual_marblenet"
    speaker_model: "titanet_small"
    msdd_model: null
    clustering_params:
      method: "nmesc"
      min_samples: 4
      oracle_num_speakers: false
      max_num_speakers: 10
      enhanced_count_thres: 90
    vad_params:
      threshold: 0.6
      window_length_in_sec: 0.1
      shift_length_in_sec: 0.02

# Output settings
output:
  format: "txt"
  style: "timestamped"

# Logging
logging:
  level: "INFO"
  file: "whisper_transcription"
  console_level: "INFO"
  file_level: "DEBUG"
  retention_days: 1
