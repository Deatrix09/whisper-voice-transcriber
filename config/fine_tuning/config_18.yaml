# Model settings
model:
  name: "large-v2"
  language: ""

# Whisper AI Configuration
whisper:
  sample_rate: 16000

# Audio processing
audio:
  chunk_size: 360
  chunk_threshold_mb: 20
  chunk_overlap_sec: 0

# Performance settings
performance:
  device: "cuda"
  num_workers: 4

# Transcription settings
transcription:
  task: "transcribe"
  temperature: 0.0
  compression_ratio_threshold: 3.2
  logprob_threshold: -1.3
  no_speech_threshold: 0.65
  fp16: true
  verbose: false
  multi_language: false

# Diarization settings
diarization:
  enabled: true
  module: "nemo"
  num_speakers: 0

  pyannote:
    enabled: false
    model: "pyannote/speaker-diarization-3.1"
    auth_token: "${HF_TOKEN}"
    min_duration_off: 0.9
    min_cluster_size: 3
    method: "complete"

  nemo:
    enabled: true
    vad_model: "vad_multilingual_marblenet"
    speaker_model: "titanet_large"
    msdd_model: "msdd_large"
    clustering_params:
      method: "kmeans"
      min_samples: 1
      oracle_num_speakers: true
      max_num_speakers: 8
      enhanced_count_thres: 85
    vad_params:
      threshold: 0.3
      window_length_in_sec: 0.05
      shift_length_in_sec: 0.025

# Output settings
output:
  format: "txt"
  style: "timestamped"

# Logging
logging:
  level: "INFO"
  file: "whisper_transcription"
  console_level: "INFO"
  file_level: "DEBUG"
  retention_days: 1
