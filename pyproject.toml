[project]
name = "whisper-voice-transcriber"
version = "0.1.0"
description = "Audio transcription with Whisper + speaker diarization (CLI)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Kleveta Lukas" }]
keywords = ["speech-to-text", "transcription", "whisper", "faster-whisper", "speaker-diarization", "asr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# P0 0.2: kurátorované PŘÍMÉ závislosti (tranzitivní dořeší resolver).
# Plný freeze pro pip je v requirements.txt (+ requirements-cuda/cpu.txt).
# torch 2.14.1 (bezpečnostní opravy) + torchaudio 2.11.0 (poslední vydaná, funguje
# s torch 2.14) + torchcodec 0.17 (vyžaduje torch>=2.11). Torch se bere z CUDA 12.6
# indexu (viz [tool.uv.sources]): PyPI kola torch 2.14 jsou CUDA 13, ale CTranslate2
# (faster-whisper) potřebuje CUDA 12 knihovny (cuBLAS 12 + cuDNN 9).
dependencies = [
    "torch==2.14.1",
    "torchaudio==2.11.0",
    "faster-whisper==1.2.1",
    "pyannote.audio>=4.0",
    "numpy>=1.26",  # 4.x resolver si vybere kompatibilní (základní API stabilní)
    "pandas>=2.2",  # 4.x resolver si vybere kompatibilní (DataFrame API stabilní)
    "PyYAML>=6.0",
    "python-dotenv==1.2.2",
    "rapidfuzz>=3.0.0",
    "jiwer>=4.0",
    "soundfile>=0.13.1",  # pyannote 4.x vyžaduje >=0.13.1 (resolver)
    "pydub==0.25.1",
    "transformers>=5.19",
    "librosa==0.10.2.post1",
    "noisereduce==3.0.3",
    "omegaconf==2.3.0",
]

[project.urls]
Homepage = "https://github.com/Deatrix09/whisper-voice-transcriber"
Issues = "https://github.com/Deatrix09/whisper-voice-transcriber/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
# Volitelné grafické rozhraní: streamlit run app.py
ui = ["streamlit>=1.39"]
# NeMo (Parakeet ASR, Sortformer, legacy NeMo diarizace) záměrně NENÍ extra:
# nemo-toolkit 3.0.0 pinuje lightning<=2.4.0 a hydra-core<=1.3.2 (známé CVE)
# a uv.lock by je pak vynutil všem. Instalace zvlášť: viz README.

[project.scripts]
whisper-transcribe = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
# Bezpečnostní minima tranzitivních závislostí (Dependabot advisories).
constraint-dependencies = [
    "lightning>=2.6.6",
    "fsspec>=2026.6.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
